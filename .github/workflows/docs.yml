name: Documentation

on:
  push:
    branches:
      - main
      - 'publish-*'
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch or tag to rebuild
        required: false
        default: ''

permissions:
  contents: write

jobs:
  docs:
    uses: AMWA-TV/amwa-spec-docs/.github/workflows/docs.yml@main
    with:
      versioned: false
      site-name: info-template
      public-docs-root: https://specs.amwa.tv/new/info-template
      source-ref: ${{ inputs.ref || github.ref_name }}
      toolkit-ref: main
    secrets: inherit
